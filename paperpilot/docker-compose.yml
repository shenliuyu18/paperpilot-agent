services:
  paperpilot:
    build: .
    ports:
      - "8765:8765"
    environment:
      PAPERPILOT_LLM_API_KEY: ${PAPERPILOT_LLM_API_KEY:-}
      PAPERPILOT_LLM_BASE_URL: ${PAPERPILOT_LLM_BASE_URL:-https://api.openai.com/v1}
      PAPERPILOT_LLM_MODEL: ${PAPERPILOT_LLM_MODEL:-gpt-4o-mini}
    restart: unless-stopped
